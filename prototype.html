<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESE 2027 Study OS — Exact Nothing OS Ndot Typography (Image 3 Match)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Ndot';
      src: url('./fonts/Ndot-57-Aligned.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #000000;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.16);
      --acc: #E52712;
      --ink: #FFFFFF;
      --ink-sub: #A3A3A3;
      --font-ndot: 'Ndot', monospace;
      --font-ui: 'Space Grotesk', sans-serif;
    }
    html[data-theme="light"] {
      --bg: #FAFAFA;
      --card: rgba(0,0,0,0.03);
      --border: rgba(0,0,0,0.12);
      --acc: #E52712;
      --ink: #0A0A0A;
      --ink-sub: #737373;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px 100px;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* Authentic Nothing Dot Grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.8;
    }

    .theme-toggle-bar {
      position: sticky;
      top: 10px;
      z-index: 100;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .theme-btn {
      border: none;
      background: transparent;
      color: var(--ink-sub);
      font-family: var(--font-ndot);
      font-size: 11px;
      padding: 6px 16px;
      border-radius: 999px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      transition: all 0.25s;
    }
    .theme-btn.active {
      background: var(--ink);
      color: var(--bg);
    }

    .device-frame {
      width: 100%;
      max-width: 440px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px 20px 80px;
      position: relative;
      min-height: 720px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
    }

    /* Exact Image 3 Ndot Header Styling */
    .ndot-heading {
      font-family: var(--font-ndot);
      font-size: 20px;
      line-height: 1.3;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    .btn-acc {
      background: var(--ink);
      color: var(--bg);
      border: 1px solid var(--ink);
      font-family: var(--font-ndot);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 14px 20px;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      transition: all 0.25s;
    }
    .btn-acc:hover {
      background: var(--acc);
      color: #FFFFFF;
      border-color: var(--acc);
    }

    .nav-bar {
      position: absolute;
      bottom: 12px;
      left: 20px;
      right: 20px;
      height: 60px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }
    .nav-item {
      font-family: var(--font-ndot);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-sub);
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 12px;
    }
    .nav-item.active {
      color: var(--bg);
      background: var(--ink);
    }
  </style>
</head>
<body>

  <!-- Theme Selector Header -->
  <div class="theme-toggle-bar">
    <button class="theme-btn active" onclick="setTheme('dark')">⬛ Nothing Dark</button>
    <button class="theme-btn" onclick="setTheme('light')">⬜ Nothing Light</button>
  </div>

  <div class="device-frame">
    <!-- TOP STATUS DECK -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
      <span style="font-family:var(--font-ndot); font-size:10px; letter-spacing:0.12em; background:var(--card); padding:6px 12px; border-radius:999px; border:1px solid var(--border)">⚡ ESE 2027 · 179D</span>
      <span style="font-family:var(--font-ndot); font-size:10px; letter-spacing:0.12em; color:var(--acc); background:rgba(229,39,18,0.1); padding:6px 12px; border-radius:999px; border:1px solid rgba(229,39,18,0.3)">🧊 5D STREAK</span>
      <span style="font-family:var(--font-ndot); font-size:10px; letter-spacing:0.12em; background:var(--card); padding:6px 12px; border-radius:999px; border:1px solid var(--border)">🎧 RAIN</span>
    </div>

    <!-- MAIN TODAY SCREEN -->
    <div>
      <div style="font-family:var(--font-ndot); font-size:11px; color:var(--ink-sub); letter-spacing:0.14em; text-transform:uppercase; margin-bottom:4px">Good evening, Teja</div>
      <div class="ndot-heading" style="font-size:24px; margin-bottom:18px">AUG 2 · DAY 12</div>

      <!-- Hero Target Card -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px">
          <span style="font-family:var(--font-ndot); font-size:10px; color:var(--acc); letter-spacing:0.16em; text-transform:uppercase">● ACTIVE TARGET</span>
          <span style="font-family:var(--font-ndot); font-size:10px; color:var(--ink-sub); letter-spacing:0.1em">09:00 - 11:30</span>
        </div>
        <div class="ndot-heading" style="font-size:18px; margin-bottom:8px">ANALOG OP-AMPS</div>
        <div style="font-size:12px; color:var(--ink-sub); margin-bottom:18px">3 of 5 tasks completed today</div>
        <button class="btn-acc">▶ LAUNCH FOCUS SPACE</button>
      </div>

      <!-- Exact Image 3 Showcase Card -->
      <div class="card" style="text-align:center; padding:24px">
        <div class="ndot-heading" style="margin-bottom:10px">ABOUT</div>
        <div class="ndot-heading" style="margin-bottom:10px">COMMUNITY</div>
        <div class="ndot-heading" style="margin-bottom:10px">CLUB NOTHING (R)</div>
        <div class="ndot-heading">PLAYGROUND</div>
      </div>
    </div>

    <!-- BOTTOM NAVBAR -->
    <div class="nav-bar">
      <div class="nav-item active">TODAY</div>
      <div class="nav-item">PLAN</div>
      <div class="nav-item">FOCUS</div>
      <div class="nav-item">STATS</div>
      <div class="nav-item">YOU</div>
    </div>

  </div>

  <script>
    function setTheme(mode) {
      document.documentElement.setAttribute('data-theme', mode);
      document.querySelectorAll('.theme-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (mode === 'dark' && idx === 0) || (mode === 'light' && idx === 1));
      });
    }
  </script>
</body>
</html>
