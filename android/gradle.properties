# Reduced memory allocation for 8GB RAM system
# 1536m leaves enough RAM for system + IDE + Android build tools
org.gradle.jvmargs=-Xmx1536m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
# Disable parallel execution to reduce memory pressure
org.gradle.parallel=false

# Disable parallel sync to reduce memory usage
org.gradle.tooling.parallel=false

# Configure Gradle daemon to be more memory-efficient
org.gradle.daemon=true
org.gradle.configureondemand=true
