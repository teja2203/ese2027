<!DOCTYPE html>

<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Ndot';
  src: url('/fonts/Ndot-57-Aligned.ttf') format('truetype'),
       url('./fonts/Ndot-57-Aligned.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
</style>
<link rel="stylesheet" href="./css/app.css">
<style>
/* ── Nothing splash — dot-matrix wordmark, square red pixels, 4s ── */
:root{
  --red:#D71921;
  --ink:#FFFFFF;
  --dim:#5A5A5A;
}
#splash{ position:fixed; inset:0; z-index:2147483200; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:#000000;
  transition:opacity .5s cubic-bezier(.22,1,.36,1), visibility .5s; }
#splash.out{ opacity:0; visibility:hidden; pointer-events:none; }

/* square red pixel dust rising */
#splash .dust{ position:absolute; inset:0; pointer-events:none; }
#splash .dust i{ position:absolute; bottom:-6%; width:6px; height:6px;
  background:var(--red); opacity:0;
  animation:spRise var(--d,6s) linear var(--dl,0s) infinite; }
@keyframes spRise{ 0%{ opacity:0; transform:translateY(0) scale(.5); }
  10%{ opacity:.85; } 70%{ opacity:.7; }
  100%{ opacity:0; transform:translateY(-88vh) translateX(var(--dx,0)) scale(1); } }

/* the wordmark stage */
#splash .stage{ position:relative; display:flex; flex-direction:column; align-items:center;
  gap:20px; transform:scale(.94); animation:spStage 4s cubic-bezier(.33,0,.15,1) both; }
@keyframes spStage{ 0%{ transform:scale(.94); } 30%{ transform:scale(1); }
  100%{ transform:scale(1.04); } }

/* dot-matrix wordmark */
#splash .word{ position:relative; font-family:'Doto','Ndot','Space Grotesk',monospace;
  font-variation-settings:"ROND" 100; font-weight:400;
  font-size:clamp(38px,9vmin,54px); letter-spacing:.08em; color:var(--ink);
  opacity:0; animation:spWordIn .7s ease 1.2s both; }
#splash .word .sl{ color:var(--red); }
@keyframes spWordIn{ 0%{ opacity:0; transform:translateY(8px); } 100%{ opacity:1; transform:none; } }

#splash .sub{ font-family:'Space Mono',monospace; font-size:10px; font-weight:700;
  letter-spacing:.28em; text-transform:uppercase; color:var(--dim); margin-top:-6px;
  opacity:0; animation:spWordIn .6s ease 2s both; }
#splash .cd{ font-family:'Space Mono',monospace; font-size:12px; font-weight:700;
  letter-spacing:.1em; color:var(--red); opacity:0;
  animation:spWordIn .6s ease 2.4s both, spBreathe 2.4s ease-in-out 3.2s infinite; }
@keyframes spBreathe{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }

@media (prefers-reduced-motion: reduce){
  #splash .dust{ display:none !important; }
  #splash .stage{ animation:none; transform:none; }
  #splash .word,#splash .sub,#splash .cd{ animation:none !important; opacity:1; } }
</style>
<script src="./js/supabase.min.js"></script>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="dust" id="spDust"></div>
  <div class="stage">
    <div class="word">ESE<span class="sl">//</span>2027</div>
    <div class="sub">MISSION CONTROL</div>
    <div class="cd" id="spCd"></div>
  </div>
</div>
<script>
(function(){
  /* countdown */
  var now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var d=Math.max(0,Math.round((new Date(2027,0,31)-today)/864e5));
  var el=document.getElementById("spCd"); if(el) el.textContent=d+" DAYS TO ESE";
  /* square red pixel dust rising */
  var dust=document.getElementById("spDust");
  if(dust && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    var n=28, html="";
    for(var i=0;i<n;i++){
      var left=Math.random()*100, d1=4+Math.random()*4, dl=Math.random()*2.5;
      var dx=(Math.random()*50-25)+"px";
      html+='<i style="left:'+left+'%;--d:'+d1+'s;--dl:'+dl+'s;--dx:'+dx+'"></i>';
    }
    dust.innerHTML=html;
  }
})();
</script>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <nav id="nav" aria-label="Main navigation"></nav>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept="application/json,.json" style="display:none">
<script src="./js/data.js"></script>
<script src="./js/app.js?v=58"></script>
</body>
</html>
