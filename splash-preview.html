<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESE2027 — Cinematic Splash Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;font-family:'Space Mono',monospace;}
.replay{position:fixed;z-index:9;left:50%;bottom:22px;transform:translateX(-50%);
  background:#161310;color:#ffe9a8;border:1px solid #d4a53a;border-radius:999px;
  padding:10px 20px;font:700 12px 'Space Mono',monospace;letter-spacing:.14em;cursor:pointer;}
:root{ --gold:#d4a53a; --gold-hi:#ffe9a8; --gold-deep:#a9781f; --ink:#161310; --dim:#8a7a55; }
#splash{ position:fixed; inset:0; z-index:2; overflow:hidden;
  display:flex; align-items:center; justify-content:center; background:#08070a;
  animation:spStudio 3s cubic-bezier(.4,0,.2,1) both;
  transition:opacity .6s cubic-bezier(.22,1,.36,1), visibility .6s; }
#splash.out{ opacity:0; visibility:hidden; pointer-events:none; }
@keyframes spStudio{ 0%{ background:#08070a; } 45%{ background:#241d0f; }
  75%{ background:#f3eee6; } 100%{ background:#ffffff; } }
#splash .vlight{ position:absolute; top:-14%; left:50%; width:120vmin; height:120vmin;
  transform:translateX(-50%); pointer-events:none; opacity:0; mix-blend-mode:screen;
  background:radial-gradient(60% 55% at 50% 22%, rgba(255,236,183,.85) 0%, rgba(255,225,150,.35) 34%, rgba(255,225,150,0) 68%);
  filter:blur(6px); animation:spBeam 3.2s ease-out 1.6s both; }
@keyframes spBeam{ 0%{ opacity:0; transform:translateX(-50%) translateY(-8%) scale(.9); }
  60%{ opacity:1; } 100%{ opacity:.55; transform:translateX(-50%) translateY(0) scale(1); } }
#splash .bloom{ position:absolute; left:50%; top:44%; width:78vmin; height:78vmin;
  transform:translate(-50%,-50%); pointer-events:none; opacity:0; mix-blend-mode:screen;
  background:radial-gradient(circle, rgba(255,214,140,.5) 0%, rgba(255,214,140,0) 62%);
  filter:blur(10px); animation:spBloom 6s ease-in-out 2.4s both; }
@keyframes spBloom{ 0%{ opacity:0; } 30%{ opacity:.9; } 100%{ opacity:.6; } }
#splash .dust{ position:absolute; inset:0; pointer-events:none; }
#splash .dust i{ position:absolute; bottom:-6%; width:3px; height:3px; border-radius:50%;
  background:radial-gradient(circle,var(--gold-hi),var(--gold) 60%,transparent);
  box-shadow:0 0 6px rgba(255,214,140,.8); opacity:0;
  animation:spRise var(--d,7s) linear var(--dl,0s) infinite; }
@keyframes spRise{ 0%{ opacity:0; transform:translateY(0) scale(.6); }
  12%{ opacity:.9; } 70%{ opacity:.7; } 100%{ opacity:0; transform:translateY(-88vh) translateX(var(--dx,0)) scale(1); } }
#splash .stage{ position:relative; display:flex; flex-direction:column; align-items:center;
  gap:22px; transform:scale(.92); animation:spDolly 10s cubic-bezier(.33,0,.15,1) both; }
@keyframes spDolly{ 0%{ transform:scale(.92); } 22%{ transform:scale(1); }
  80%{ transform:scale(1.02); } 100%{ transform:scale(1.06); } }
#splash .disc{ position:relative; width:min(52vmin,300px); aspect-ratio:1; }
#splash .disc img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
  opacity:0; animation:spEmblem 2.4s cubic-bezier(.34,1.1,.42,1) 1.7s both; }
@keyframes spEmblem{ 0%{ opacity:0; transform:scale(.86) translateY(10px); filter:brightness(.4); }
  55%{ opacity:1; filter:brightness(1.12); } 100%{ opacity:1; transform:scale(1); filter:brightness(1); } }
#splash .sweep{ position:absolute; inset:6%; border-radius:50%; pointer-events:none;
  opacity:0; mix-blend-mode:screen;
  background:conic-gradient(from 0deg, transparent 0deg, rgba(255,238,190,.9) 32deg, transparent 74deg, transparent 360deg);
  -webkit-mask:radial-gradient(circle, transparent 44%, #000 50%, #000 72%, transparent 78%);
          mask:radial-gradient(circle, transparent 44%, #000 50%, #000 72%, transparent 78%);
  animation:spSweep 2.6s cubic-bezier(.4,0,.3,1) 3s both; }
@keyframes spSweep{ 0%{ opacity:0; transform:rotate(-30deg); }
  15%{ opacity:1; } 85%{ opacity:1; } 100%{ opacity:0; transform:rotate(340deg); } }
#splash .disc::after{ content:""; position:absolute; inset:0; pointer-events:none;
  mix-blend-mode:screen; opacity:0; border-radius:50%;
  background:linear-gradient(115deg, transparent 38%, rgba(255,240,200,.55) 50%, transparent 62%);
  background-size:280% 280%; animation:spShimmer 3.4s ease-in-out 5.6s infinite; }
@keyframes spShimmer{ 0%{ opacity:0; background-position:120% 0; }
  35%{ opacity:.9; } 65%{ opacity:.9; } 100%{ opacity:0; background-position:-40% 0; } }
#splash .spark{ position:absolute; width:5px; height:5px; border-radius:50%; top:50%; left:50%;
  margin:-2.5px; opacity:0; background:radial-gradient(circle,#fff,var(--gold-hi) 55%,transparent);
  box-shadow:0 0 8px rgba(255,225,150,.9); animation:spOrbit 4s linear 5.9s infinite; }
#splash .spark.s2{ animation-delay:6.4s; } #splash .spark.s3{ animation-delay:6.9s; }
#splash .spark.s4{ animation-delay:7.3s; }
@keyframes spOrbit{ 0%{ opacity:0; transform:rotate(0deg) translateX(24vmin) rotate(0deg) scale(.5); }
  10%{ opacity:1; } 90%{ opacity:1; } 100%{ opacity:0; transform:rotate(300deg) translateX(24vmin) rotate(-300deg) scale(1); } }
#splash .word{ position:relative; font-family:'Space Grotesk',sans-serif; font-weight:700;
  font-size:clamp(30px,7vmin,46px); letter-spacing:.16em; color:var(--gold-deep);
  opacity:0; animation:spWordIn .9s ease 6.4s both; }
#splash .word b{ font-weight:700; color:var(--gold); }
#splash .word::after{ content:"ESE2027"; position:absolute; inset:0; letter-spacing:.16em;
  color:transparent; background:linear-gradient(100deg, transparent 42%, rgba(255,248,224,.95) 50%, transparent 58%);
  -webkit-background-clip:text; background-clip:text; background-size:250% 100%;
  animation:spGlint 1.6s cubic-bezier(.4,0,.2,1) 7s both; }
@keyframes spWordIn{ 0%{ opacity:0; transform:translateY(10px); } 100%{ opacity:1; transform:none; } }
@keyframes spGlint{ 0%{ background-position:160% 0; } 100%{ background-position:-60% 0; } }
#splash .sub{ font-family:'Space Mono',monospace; font-size:10px; font-weight:700;
  letter-spacing:.32em; text-transform:uppercase; color:var(--dim); margin-top:-8px;
  opacity:0; animation:spWordIn .8s ease 7.4s both; }
#splash .cd{ font-family:'Space Mono',monospace; font-size:12px; font-weight:700;
  letter-spacing:.12em; color:var(--gold-deep); opacity:0;
  animation:spWordIn .8s ease 7.8s both, spBreathe 3s ease-in-out 8.6s infinite; }
@keyframes spBreathe{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
</style>
</head>
<body>
<button class="replay" onclick="replay()">▶ REPLAY 10s REVEAL</button>
<div id="splash" aria-hidden="true">
  <div class="vlight"></div>
  <div class="bloom"></div>
  <div class="dust" id="spDust"></div>
  <div class="stage">
    <div class="disc">
      <img src="./icons/icon-512.png" alt="ESE2027">
      <div class="sweep"></div>
      <div class="spark s1"></div><div class="spark s2"></div>
      <div class="spark s3"></div><div class="spark s4"></div>
    </div>
    <div class="word">ESE<b>2027</b></div>
    <div class="sub">Mission Control</div>
    <div class="cd" id="spCd"></div>
  </div>
</div>
<script>
function seedDust(){
  var dust=document.getElementById("spDust"), n=34, html="";
  for(var i=0;i<n;i++){
    var left=Math.random()*100, d1=5+Math.random()*5, dl=Math.random()*3;
    var dx=(Math.random()*40-20)+"px", sc=.5+Math.random()*1.3;
    html+='<i style="left:'+left+'%;--d:'+d1+'s;--dl:'+dl+'s;--dx:'+dx+';transform:scale('+sc+')"></i>';
  }
  dust.innerHTML=html;
}
(function(){
  var today=new Date(); today.setHours(0,0,0,0);
  var d=Math.max(0,Math.round((new Date(2027,0,31)-today)/864e5));
  document.getElementById("spCd").textContent=d+" days to ESE";
  seedDust();
})();
function replay(){
  var old=document.getElementById("splash");
  var fresh=old.cloneNode(true);
  old.parentNode.replaceChild(fresh,old);
  seedDust();
}
</script>
</body>
</html>
