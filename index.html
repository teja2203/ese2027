<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ESE2027 — Study OS</title>
<meta name="description" content="Personal study operating system for ESE 2027 and APTRANSCO 2026 — day-by-day plan, focus timer, and progress analytics.">
<meta name="theme-color" content="#0D0F12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESE2027">
<meta name="application-name" content="ESE2027">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
<style>
/* ── animated splash (inline so it paints instantly) ─── */
#splash{ position:fixed; inset:0; z-index:2147483200; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:26px; background:#0D0F12;
  transition:opacity .45s cubic-bezier(.22,1,.36,1), visibility .45s; }
#splash.out{ opacity:0; visibility:hidden; pointer-events:none; }
#splash .disc{ position:relative; width:132px; height:132px; }
#splash .disc img{ position:absolute; inset:0; width:100%; height:100%; border-radius:32px;
  animation:spIcon 1.6s cubic-bezier(.34,1.5,.42,1) both,
            spFloat 2.6s ease-in-out 1.6s infinite; }
#splash .ring{ position:absolute; inset:-14px; border-radius:44px;
  border:2.5px solid rgba(201,242,78,.85); opacity:0;
  animation:spRing 1.6s cubic-bezier(.22,1,.36,1) .9s infinite; }
#splash .ring.r2{ inset:-26px; border-radius:52px; border-color:rgba(201,242,78,.35);
  animation-delay:1.25s; }
#splash .halo{ position:absolute; inset:-8px; border-radius:38px;
  box-shadow:0 0 60px 12px rgba(201,242,78,.28); opacity:0;
  animation:spHalo 1s ease .9s both, spBreathe 2.6s ease-in-out 1.9s infinite; }
@keyframes spIcon{
  0%{ opacity:0; transform:scale(.25) rotate(-540deg) translateY(60px); }
  55%{ opacity:1; transform:scale(1.12) rotate(14deg) translateY(0); }
  75%{ transform:scale(.96) rotate(-5deg); }
  100%{ opacity:1; transform:scale(1) rotate(0); } }
@keyframes spFloat{ 0%,100%{ transform:translateY(0) scale(1); } 50%{ transform:translateY(-7px) scale(1.02); } }
@keyframes spRing{
  0%{ opacity:.9; transform:scale(.7); }
  100%{ opacity:0; transform:scale(1.45); } }
@keyframes spHalo{ from{ opacity:0; } to{ opacity:1; } }
@keyframes spBreathe{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
#splash .t{ display:flex; gap:2px; font-family:'Outfit',system-ui,sans-serif;
  font-size:27px; font-weight:800; letter-spacing:-.02em; color:#F2F4F1; }
#splash .t span{ display:inline-block; animation:spChar .7s cubic-bezier(.34,1.5,.42,1) both; }
#splash .t span:nth-child(1){animation-delay:1.15s}#splash .t span:nth-child(2){animation-delay:1.27s}
#splash .t span:nth-child(3){animation-delay:1.39s}#splash .t span:nth-child(4){animation-delay:1.51s}
#splash .t span:nth-child(5){animation-delay:1.63s}#splash .t span:nth-child(6){animation-delay:1.75s}
#splash .t span:nth-child(7){animation-delay:1.87s}
#splash .t .lime{ color:#C9F24E; }
@keyframes spChar{ 0%{ opacity:0; transform:translateY(22px) scale(.7); }
  100%{ opacity:1; transform:none; } }
#splash .sub{ font-family:'Inter',system-ui,sans-serif; font-size:11px; font-weight:700;
  letter-spacing:.28em; text-transform:uppercase; color:#878D84; margin-top:-14px;
  animation:spChar .7s ease 2.15s both; }
@media (prefers-reduced-motion: reduce){
  #splash .disc img,#splash .ring,#splash .halo,#splash .t span,#splash .sub{ animation:none !important; opacity:1; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="disc">
    <div class="halo"></div>
    <img src="./icons/icon-192.png" alt="">
    <div class="ring"></div>
    <div class="ring r2"></div>
  </div>
  <div class="t"><span>E</span><span>S</span><span>E</span><span class="lime">2</span><span class="lime">0</span><span class="lime">2</span><span class="lime">7</span></div>
  <div class="sub">Study OS</div>
</div>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <nav id="nav" aria-label="Main navigation"></nav>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept="application/json,.json" style="display:none">
<script src="./js/data.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
