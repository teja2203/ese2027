<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ESE2027 — Study OS</title>
<meta name="description" content="Study sanctuary for ESE 2027 exam preparation — craft your path to mastery with focus and discipline.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESE2027">
<meta name="application-name" content="ESE2027">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Ndot';
  src: url('/fonts/Ndot-57-Aligned.ttf') format('truetype'),
       url('./fonts/Ndot-57-Aligned.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
</style>
<link rel="stylesheet" href="./css/app.css">
<style>
/* ── Nothing splash — monochrome dot-matrix ───────────── */
:root{
  --splash-bg:#000000;
  --splash-acc:#D71921;
  --splash-text:#F5F5F2;
  --splash-dim:#555550;
}
#splash{ position:fixed; inset:0; z-index:2147483200; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:26px; background:var(--splash-bg);
  transition:opacity .45s cubic-bezier(.22,1,.36,1), visibility .45s; }
#splash::before{ content:""; position:fixed; inset:0; pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.13) 1px, transparent 1px);
  background-size:22px 22px; }
#splash.out{ opacity:0; visibility:hidden; pointer-events:none; }
#splash .disc{ position:relative; width:120px; height:120px; }
#splash .disc img{ position:absolute; inset:0; width:100%; height:100%; border-radius:22px;
  filter:grayscale(1) contrast(1.05);
  animation:spIcon 1s cubic-bezier(.34,1.2,.42,1) both; }
#splash .ring{ position:absolute; inset:-12px; border-radius:30px;
  border:1.5px solid rgba(215,25,33,.6); opacity:0;
  animation:spRing 1.4s cubic-bezier(.22,1,.36,1) .7s infinite; }
#splash .ring.r2{ inset:-24px; border-radius:38px; border-color:rgba(215,25,33,.22);
  animation-delay:1.05s; }
@keyframes spIcon{
  0%{ opacity:0; transform:scale(.5) translateY(26px); }
  60%{ opacity:1; transform:scale(1.06) translateY(0); }
  80%{ transform:scale(.98); }
  100%{ opacity:1; transform:scale(1); } }
@keyframes spRing{
  0%{ opacity:.85; transform:scale(.72); }
  100%{ opacity:0; transform:scale(1.4); } }
#splash .t{ display:flex; gap:7px; font-family:'Ndot','Doto',monospace;
  font-size:30px; letter-spacing:.02em; color:var(--splash-text);
  text-rendering:geometricPrecision; }
#splash .t span{ display:inline-block; animation:spChar .5s cubic-bezier(.34,1.2,.42,1) both; }
#splash .t span:nth-child(1){animation-delay:1.05s}#splash .t span:nth-child(2){animation-delay:1.14s}
#splash .t span:nth-child(3){animation-delay:1.23s}#splash .t span:nth-child(4){animation-delay:1.32s}
#splash .t span:nth-child(5){animation-delay:1.41s}#splash .t span:nth-child(6){animation-delay:1.5s}
#splash .t span:nth-child(7){animation-delay:1.59s}
#splash .t .lime{ color:var(--splash-acc); }
@keyframes spChar{ 0%{ opacity:0; transform:translateY(18px) scale(.8); }
  100%{ opacity:1; transform:none; } }
#splash .sub{ font-family:'Space Mono',monospace; font-size:10px; font-weight:700;
  letter-spacing:.34em; text-transform:uppercase; color:var(--splash-dim); margin-top:-14px;
  animation:spChar .5s ease 1.95s both; }
#splash .cd{ font-family:'Space Mono',monospace; font-size:12px; font-weight:700;
  letter-spacing:.14em; color:var(--splash-acc); margin-top:2px;
  animation:spChar .5s ease 2.3s both, spBreathe 2.6s ease-in-out 3s infinite; }
@keyframes spBreathe{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
@media (prefers-reduced-motion: reduce){
  #splash .disc img,#splash .ring,#splash .t span,#splash .sub{ animation:none !important; opacity:1; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="disc">
    <div class="halo"></div>
    <img src="./icons/icon-192.png" alt="">
    <div class="ring"></div>
    <div class="ring r2"></div>
  </div>
  <div class="t"><span>E</span><span>S</span><span>E</span><span class="lime">2</span><span class="lime">0</span><span class="lime">2</span><span class="lime">7</span></div>
  <div class="sub">Study OS · Mission Control</div>
  <div class="cd" id="spCd"></div>
</div>
<script>
(function(){
  var now=new Date();
  var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var exam=new Date(2027,0,31);
  var d=Math.max(0,Math.round((exam-today)/864e5));
  var el=document.getElementById("spCd");
  if(el) el.textContent=d+" days to ESE";
})();
</script>
<div id="app">
  <main id="view" aria-live="polite"></main>
  <nav id="nav" aria-label="Main navigation"></nav>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept="application/json,.json" style="display:none">
<script src="./js/data.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
